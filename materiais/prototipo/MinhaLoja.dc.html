<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pede Barra – Personalizar loja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3142B;text-decoration:none}a:hover{color:#8C0F22}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF5F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #221A1C; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #FFFFFF; border-bottom: 1px solid #F2DDE0">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: #5B6663">Painel do comerciante</span>
<span style="font-size: 18px; font-weight: 800">Personalizar minha loja</span>
</div>
<svg width="40" height="40" viewBox="0 0 120 120" role="img" aria-label="Pede Barra">
<defs><linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB5C74"></stop><stop offset="1" stop-color="#E8213D"></stop></linearGradient></defs><rect width="120" height="120" rx="30" fill="url(#pbg)"></rect>
<path d="M45 44v-6a15 15 0 0 1 30 0v6" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
<path d="M28 44h64l-6 50a7 7 0 0 1-7 6H41a7 7 0 0 1-7-6z" fill="#FFFFFF"></path>
<path d="M39 68q7-7 14 0t14 0t14 0" fill="none" stroke="#E8213D" stroke-width="5" stroke-linecap="round"></path>
</svg>
</div>

<div style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: #5B6663">PRÉVIA — COMO O CLIENTE VÊ</span>
<div style="background: #FFFFFF; border-radius: 16px; overflow: hidden; border: 1px solid #F2DDE0">
<div style="height: 70px; background: {{cor}}; position: relative">
<div style="position: absolute; left: 14px; bottom: -22px; width: 52px; height: 52px; border-radius: 14px; background: #221A1C; color: {{cor}}; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">LÉO</div>
</div>
<div style="padding: 28px 14px 14px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800">Léo Restaurante &amp; Lancheria</span>
<span style="font-size: 12px; color: #5B6663">Lanches e refeições</span>
</div>
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{cor}}; color: {{sobre}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">+</span>
</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 800">Cor da minha loja</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{cores}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.nome}}" style="{{c.estilo}}"></button>
</sc-for>
</div>
<span style="font-size: 13px; color: #5B6663">Escolhida: <strong>{{nomeCor}}</strong></span>
</div>

<div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Nome da loja
<input type="text" value="Léo Restaurante &amp; Lancheria" style="height: 44px; border-radius: 10px; border: 1px solid #DCC7CB; padding: 0 12px; font: inherit; font-weight: 500; font-size: 15px; color: #221A1C">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 64px; border-radius: 12px; border: 2px dashed #DCC7CB; background: #FFF5F6; font: inherit; font-size: 13px; font-weight: 700; color: #221A1C">Trocar logo</button>
<button type="button" style="height: 64px; border-radius: 12px; border: 2px dashed #DCC7CB; background: #FFF5F6; font: inherit; font-size: 13px; font-weight: 700; color: #221A1C">Foto de capa</button>
</div>
</div>
</div>

<div style="padding: 12px 20px 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{salvo}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 700; color: #1E7A44; text-align: center">Pronto! Tua loja já aparece com a nova cor.</span>
</sc-if>
<button type="button" onClick="{{salvar}}" style="height: 56px; border-radius: 14px; border: 0; background: #E8213D; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 16px">Salvar alterações</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cor: '#E8213D', salvo: false };
}
renderVals() {
const opcoes = [
{ nome: 'Pede Barra', hex: '#E8213D' },
{ nome: 'Laranja', hex: '#E8213D' },
{ nome: 'Verde', hex: '#1E8A4C' },
{ nome: 'Azul', hex: '#1F6FD1' },
{ nome: 'Roxo', hex: '#7A3FC2' },
{ nome: 'Amarelo', hex: '#F2B705' }
];
const lin = (c) => { c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
const lum = (h) => { const a = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); return 0.2126 * lin(a[0]) + 0.7152 * lin(a[1]) + 0.0722 * lin(a[2]); };
const cor = this.state.cor;
const L = lum(cor);
const sobre = (1.05 / (L + 0.05)) >= ((L + 0.05) / (lum('#221A1C') + 0.05)) ? '#FFFFFF' : '#221A1C';
const atual = opcoes.find((o) => o.hex === cor) || opcoes[0];
return {
cor: cor,
sobre: sobre,
nomeCor: atual.nome,
salvo: this.state.salvo,
salvar: () => this.setState({ salvo: true }),
cores: opcoes.map((o) => ({
nome: o.nome,
estilo: 'width: 44px; height: 44px; border-radius: 22px; cursor: pointer; background: ' + o.hex + '; border: 3px solid #FFFFFF; box-shadow: 0 0 0 ' + (o.hex === cor ? '3px #221A1C' : '1px #DCC7CB'),
pick: () => this.setState({ cor: o.hex, salvo: false })
}))
};
}
}
</script>
</body>
</html>
